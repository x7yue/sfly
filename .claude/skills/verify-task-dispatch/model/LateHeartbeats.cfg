\* LateHeartbeats：MaxAttempt = 3（retries = 2），1 个槽位，每个方向最多 3 条在途消息。
\* 连接正常时租约也可能过期：五条性质都必须成立。
SPECIFICATION Spec
CONSTANTS
    MaxAttempt = 3
    Slots = 1
    LateHeartbeats = TRUE
    PromptDelivery = TRUE
    MaxInFlight = 3
CONSTRAINT InFlight
INVARIANTS
    TypeOK
    NoUnstoppedDuplicate
    SlotBound
    AssignOnlyWhenReady
    AtMostOneSuccess
    SuccessWasRun
