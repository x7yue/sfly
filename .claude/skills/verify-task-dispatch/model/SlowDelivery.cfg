\* SlowDelivery：MaxAttempt = 3（retries = 2），1 个槽位，每个方向最多 3 条在途消息。
\* 消息可能晚于两个心跳周期才被处理：五条性质都必须成立。
SPECIFICATION Spec
CONSTANTS
    MaxAttempt = 3
    Slots = 1
    LateHeartbeats = FALSE
    PromptDelivery = FALSE
    MaxInFlight = 3
CONSTRAINT InFlight
INVARIANTS
    TypeOK
    NoUnstoppedDuplicate
    SlotBound
    AssignOnlyWhenReady
    AtMostOneSuccess
    SuccessWasRun
