version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # 消息与服务名沿用 docs/ARCHITECTURE.md §5.2（AgentGateway / AgentMessage / ServerMessage）。
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
