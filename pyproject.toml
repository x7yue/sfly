# uv 虚拟工作区根（不是可发布的包）。成员见 [tool.uv.workspace]。
[tool.uv.workspace]
members = ["sdk/python", "std"]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    # sfly.cli.build 在 Python 3.10 上用 tomli；mypy 以 3.10 为目标检查时需要它的类型。
    "tomli>=2",
    "types-jsonschema>=4.23",
    # sfly-std 的进程类节点和测试用 psutil。
    "types-psutil>=5.9",
]

[tool.uv]
default-groups = ["dev"]

# uv.lock 里记录的是 PyPI 的地址；用户级配置换了默认源（镜像）时，--locked 会因为锁文件里的源不在配置里而失败。
# 在项目里声明 PyPI：项目级的源排在用户级的前面，解析和校验都用它。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["node_modules", "apps", "packages", "*.md"]

[tool.ruff.lint]
# G：日志参数按 % 传入（sdk-reference「ctx.log」），不在调用前用 f-string、% 或 format 拼好。
# G010 不适用：`ctx.log.warn` 是 SDK 文档里写明的 `warning` 别名。
select = ["E", "F", "W", "I", "UP", "B", "G"]
ignore = ["G010"]

[tool.ruff.lint.isort]
known-first-party = ["sfly", "sfly_std"]

[tool.mypy]
strict = true
files = ["sdk/python/src", "sdk/python/tests", "sdk/python/benchmarks", "std/src", "std/tests", "scripts/tests"]
# sdk/python/tests 里 sfly.testing 的测试直接导入桩节点包的节点函数。
# sdk/python/tests 里的测试从 indexes.py 导入共用的桩，std/tests 里的从 named_sleep.py 导入。
mypy_path = "testdata/stub-package/src:testdata/agent-files-package/src:sdk/python/tests:std/tests"
python_version = "3.10"
# 节点在 Agent 上运行，Agent 只支持 Linux：按 Linux 检查（与 CI 一致），macOS 上没有的属性（fcntl.F_SETPIPE_SZ 等）不误报。
platform = "linux"

[tool.pytest.ini_options]
testpaths = ["sdk/python/tests", "std/tests", "scripts/tests"]
addopts = "--import-mode=importlib"
# 测试共用的桩（sdk/python/tests/indexes.py、std/tests/named_sleep.py）。
pythonpath = ["sdk/python/tests", "std/tests"]
