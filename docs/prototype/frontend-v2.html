<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sfly · 前端正式化原型 v1</title>
<style>
:root{
  --bg:#1a1a1a;--grid:rgba(255,255,255,.06);--surface:#1f1f1f;--surface-a:rgba(31,31,31,.94);
  --raised:#262626;--raised-2:#2e2e2e;--sunk:#161616;
  --bd:#333;--bd-soft:#2b2b2b;--bd-strong:#444;
  --t1:#ececec;--t2:#a8a8a8;--t3:#8e8e8e;
  --white:#f2f2f2;--on-white:#141414;
  --accent:#2cc4f0;--accent-hi:#7fdcf7;--accent-line:rgba(44,196,240,.55);--accent-soft:rgba(44,196,240,.14);
  --ok:#5bd69a;--warn:#f0a83a;--danger:#ef5350;--violet:#b4a3f8;--cancel:#9a9a9a;
  --sel:#d4d4d4;--sel-ring:rgba(255,255,255,.08);
  --sans:"IBM Plex Sans","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --r1:4px;--r2:6px;--r3:8px;--r4:12px;
  --float:0 10px 30px -10px rgba(0,0,0,.7),0 2px 6px -2px rgba(0,0,0,.4);
  --pop:0 30px 80px -20px rgba(0,0,0,.85);
  --ease:cubic-bezier(.2,.7,.2,1);
  --sbw:208px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--t1);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.t2{color:var(--t2)}.t3{color:var(--t3)}
kbd{font-family:var(--mono);font-size:11px;padding:0 5px;min-width:18px;height:18px;display:inline-grid;place-items:center;border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;color:var(--t2);background:var(--raised)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* ---------- shell ---------- */
.shell{position:fixed;inset:0;display:grid;grid-template-columns:var(--sbw) 1fr}
.shell.col{--sbw:56px}
.sb{background:var(--surface);border-right:1px solid var(--bd-soft);display:flex;flex-direction:column;padding:12px 8px;gap:2px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--white);color:var(--on-white);display:grid;place-items:center;font:700 12px var(--mono);flex:none}
.brand b{font-size:14px;letter-spacing:.2px}
.brand div span{font-size:11px;color:var(--t3);display:block;font-weight:400}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:7px;color:var(--t2);text-decoration:none;white-space:nowrap;position:relative}
.nav:hover{background:var(--raised);color:var(--t1)}
.nav.on{background:var(--raised-2);color:var(--t1)}
.nav.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--white)}
.nav .cnt{margin-left:auto;font:11px var(--mono);color:var(--t3)}
.nav .cnt.run{color:var(--accent)}
.sb .grow{flex:1}
.sb .sbh{font-size:11px;color:var(--t3);padding:12px 10px 4px;white-space:nowrap}
.shell.col .nav span.l,.shell.col .nav .cnt,.shell.col .brand div,.shell.col .sbh{display:none}
.shell.col .nav{justify-content:center;padding:0}
.content{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;border-bottom:1px solid var(--bd-soft);background:var(--bg)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--t3);font-size:12.5px}
.crumb b{color:var(--t1);font-weight:500}
.topbar .sp{flex:1}
.searchbtn{display:flex;align-items:center;gap:8px;height:30px;width:280px;padding:0 8px 0 10px;border-radius:7px;border:1px solid var(--bd);background:var(--sunk);color:var(--t3);cursor:pointer;font-size:12.5px}
.searchbtn:hover{border-color:var(--bd-strong)}
.searchbtn kbd{margin-left:auto}
.me{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--white);color:var(--on-white);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.scroll{flex:1;overflow:auto}
/* ---------- controls ---------- */
.btn{height:30px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--bd);background:var(--raised);color:var(--t1);font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background .12s var(--ease);text-decoration:none}
.btn:hover{background:var(--raised-2)}
.btn.pri{background:var(--white);color:var(--on-white);border-color:var(--white)}
.btn.pri:hover{background:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t2)}
.btn.ghost:hover{background:var(--raised);color:var(--t1)}
.btn.danger{background:transparent;border-color:rgba(239,83,80,.45);color:#ff8f8c}
.btn.danger:hover{background:rgba(239,83,80,.1)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn.sm.icon{width:26px}
.inp{height:30px;background:var(--sunk);border:1px solid var(--bd);border-radius:var(--r2);color:var(--t1);padding:0 9px;font:inherit;width:100%;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.mono{font-family:var(--mono);font-size:12px}
.inp.bad{border-color:var(--danger)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--t3) 50%),linear-gradient(135deg,var(--t3) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat;padding-right:24px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--bd-soft);border-radius:7px;padding:2px;gap:2px;flex:none}
.seg button{height:24px;padding:0 10px;border:0;background:transparent;color:var(--t2);border-radius:5px;font-size:12px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--t1)}
.seg button.on{background:var(--raised-2);color:var(--t1)}
.sw{width:30px;height:18px;border-radius:9px;background:var(--bd);position:relative;border:0;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--t2);transition:left .15s var(--ease)}
.sw[aria-checked=true]{background:rgba(91,214,154,.85)}
.sw[aria-checked=true]::after{left:14px;background:#fff}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st.ok{color:var(--ok)}.st.run{color:var(--accent)}.st.fail{color:var(--danger)}.st.warn{color:var(--warn)}.st.mute{color:var(--t3)}
.st.mute i{background:transparent;border:1.5px solid currentColor;width:8px;height:8px}
.st.cancel{color:var(--cancel)}.st.cancel i{background:transparent;border:1.5px dashed currentColor;width:8px;height:8px}
.st.skip{color:#7a7a7a}.st.skip i{background:transparent;border:1.5px solid currentColor;width:8px;height:8px;opacity:.7}
.st.run i{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(44,196,240,.55)}70%{box-shadow:0 0 0 6px rgba(44,196,240,0)}100%{box-shadow:0 0 0 0 rgba(44,196,240,0)}}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes shimmer{to{background-position:-200% 0}}
.bars{display:inline-flex;gap:2px;vertical-align:middle;flex-wrap:nowrap}
.bars b{width:6px;height:12px;border-radius:2px;background:#3a3a3a;flex:none}
.bars b.ok{background:rgba(91,214,154,.7)}.bars b.run{background:var(--accent)}.bars b.fail{background:var(--danger)}.bars b.skip{background:transparent;box-shadow:inset 0 0 0 1px #444}.bars b.cancel{background:transparent;box-shadow:inset 0 0 0 1px #8a8a8a;background-image:repeating-linear-gradient(135deg,rgba(154,154,154,.4) 0 2px,transparent 2px 4px)}.bars b.wait{background:rgba(240,168,58,.45)}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;background:var(--raised-2);border:1px solid var(--bd);font-size:11.5px;color:var(--t2);white-space:nowrap}
.badge.violet{color:#c9bdfb;border-color:rgba(180,163,248,.35);background:rgba(180,163,248,.08)}
.badge.warn{color:var(--warn);border-color:rgba(240,168,58,.35);background:rgba(240,168,58,.08)}
.badge.fail{color:#ff8f8c;border-color:rgba(239,83,80,.4);background:rgba(239,83,80,.07)}
.badge.ok{color:var(--ok);border-color:rgba(91,214,154,.3);background:rgba(91,214,154,.07)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.dot.on{background:var(--ok)}.dot.off{background:transparent;border:1.5px solid var(--t3)}.dot.ins{background:var(--warn)}
/* ---------- pages ---------- */
.page{max-width:1360px;margin:0 auto;padding:20px 24px 60px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ph h1{font-size:16px;font-weight:600;margin:0}
.ph .count{color:var(--t3);font-size:12px}
.ph .desc{color:var(--t3);font-size:12.5px}
.ph .sp{flex:1}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search{position:relative;width:260px}
.search svg{position:absolute;left:9px;top:7px;color:var(--t3)}
.search .inp{padding-left:30px}
.panel{background:var(--surface);border:1px solid var(--bd-soft);border-radius:10px;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--bd-soft)}
.panel-h h3{margin:0;font-size:13px;font-weight:600}
.panel-h .sp{flex:1}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:500;color:var(--t3);font-size:12px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd-soft);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd-soft);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer;outline:none}
.tbl tbody tr.click:hover,.tbl tbody tr.click:focus-visible{background:rgba(255,255,255,.03)}
.tbl tbody tr:focus-visible{box-shadow:inset 2px 0 0 var(--accent)}
.name{font-weight:500}
.sub{font-size:12px;color:var(--t3)}
.slotbar{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.slotbar b{width:9px;height:9px;border-radius:2px;background:#3a3a3a}
.slotbar b.on{background:var(--t2)}
.empty{padding:56px 20px;text-align:center;color:var(--t2)}
.empty .ico{width:44px;height:44px;border-radius:12px;background:var(--raised);border:1px solid var(--bd);display:grid;place-items:center;margin:0 auto 14px;color:var(--t3)}
.empty h3{font-size:14px;margin:0 0 6px;color:var(--t1);font-weight:600}
.empty p{margin:0 0 16px;font-size:12.5px}
.sk{height:12px;border-radius:4px;background:linear-gradient(90deg,#262626 25%,#2e2e2e 37%,#262626 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
.err{margin:40px auto;max-width:520px;border:1px solid rgba(239,83,80,.35);background:rgba(239,83,80,.06);border-radius:10px;padding:16px 18px}
.err h3{margin:0 0 6px;font-size:14px;color:#ff8f8c}
.err code{font-family:var(--mono);font-size:12px;color:var(--t2)}
.sec-h{font-size:12px;color:var(--t3);font-weight:500;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--bd-soft)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--t3)}.kv dd{margin:0;min-width:0}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--bd-soft);border-radius:10px;padding:12px 14px;min-width:0}
.stat .l{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:6px}
.stat .v{font:600 22px/1.2 var(--mono);margin-top:6px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--t3);font-weight:400;margin-left:4px}
.stat .d{font-size:11.5px;color:var(--t3);margin-top:2px}
.stat svg{display:block;width:100%;height:26px;margin-top:6px}
.dgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
.dgrid .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.rrow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:11px 14px;border-bottom:1px solid var(--bd-soft);cursor:pointer}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:rgba(255,255,255,.03)}
.rrow .top{display:flex;align-items:center;gap:8px;min-width:0}
.rrow .meta{font-size:12px;color:var(--t3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rrow .right{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* scenario cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--bd-soft);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s var(--ease)}
.card:hover{border-color:var(--bd-strong)}
.thumb{height:148px;background-color:var(--sunk);background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:14px 14px;border-bottom:1px solid var(--bd-soft);position:relative;cursor:pointer}
.thumb svg{position:absolute;left:12px;right:12px;top:36px;bottom:10px;width:calc(100% - 24px);height:calc(100% - 46px)}
.thumb .tb{position:absolute;left:10px;top:9px;display:flex;gap:6px}
.thumb .tr{position:absolute;right:10px;top:9px}
.cbody{padding:12px 14px 10px;flex:1;display:flex;flex-direction:column;gap:8px}
.ctitle{display:flex;align-items:center;gap:8px}
.ctitle h3{margin:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cdesc{font-size:12.5px;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.cagents{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.agent-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;background:var(--raised);border:1px solid var(--bd-soft);font:11.5px var(--mono);color:var(--t2)}
.agent-chip.def{color:var(--t1)}
.agent-chip.bad{color:var(--t3);border-style:dashed}
.clast{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
.cfoot{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--bd-soft)}
.cfoot .sp{flex:1}
.menu{position:absolute;background:var(--raised);border:1px solid var(--bd-strong);border-radius:var(--r3);box-shadow:var(--pop);padding:4px;z-index:60;min-width:200px}
.menu .g{font-size:11px;color:var(--t3);padding:6px 8px 3px}
.menu .mi{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:5px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.menu .mi:hover,.menu .mi.act{background:var(--raised-2)}
.menu .mi .r{margin-left:auto;color:var(--t3);font-size:11.5px}
.menu .mi.danger{color:#ff8f8c}
.menu .sepr{height:1px;background:var(--bd-soft);margin:4px 0}
.menu input.inp{margin:4px 4px 6px;width:calc(100% - 8px)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80}
.drawer{position:fixed;right:0;top:0;bottom:0;width:460px;max-width:100vw;background:var(--surface);border-left:1px solid var(--bd);box-shadow:var(--pop);z-index:81;display:flex;flex-direction:column}
.dr-h{padding:14px 18px 12px;border-bottom:1px solid var(--bd-soft)}
.dr-h .r1{display:flex;align-items:center;gap:8px}
.dr-h h2{margin:0;font-size:15px;font-weight:600}
.dr-h p{margin:6px 0 0;font-size:12.5px;color:var(--t2)}
.dr-b{flex:1;overflow:auto;padding:14px 18px}
.dr-f{padding:12px 18px;border-top:1px solid var(--bd-soft);display:flex;gap:8px;align-items:center}
.dr-f .sp{flex:1}
.notice{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--accent-line);background:rgba(44,196,240,.06);color:var(--accent-hi);font-size:12.5px;margin-bottom:12px}
.notice.warn{border-color:rgba(240,168,58,.4);background:rgba(240,168,58,.06);color:#f3c27a}
.field{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;align-items:start;margin-bottom:12px}
.field>label{padding-top:6px;font-size:12.5px;color:var(--t2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.field>label .ty{display:block;font-family:var(--mono);font-size:11px;color:var(--t3)}
.field .ctl{display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.field .help{font-size:11.5px;color:var(--t3)}
.field .error{font-size:11.5px;color:#ff8f8c}
.reqmark{color:var(--danger);margin-left:2px}
.checks{list-style:none;margin:0 0 14px;padding:0;border:1px solid var(--bd-soft);border-radius:var(--r3);overflow:hidden}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--bd-soft);font-size:12.5px}
.checks li:last-child{border-bottom:0}
.checks .ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px;font-size:11px;font-weight:700}
.checks .ok .ic{background:rgba(91,214,154,.15);color:var(--ok)}
.checks .bad .ic{background:rgba(239,83,80,.15);color:var(--danger)}
.checks .wn .ic{background:rgba(240,168,58,.15);color:var(--warn)}
.checks .d{color:var(--t3);font-size:12px}
.checks a{color:var(--t1);text-decoration:underline;text-underline-offset:2px;cursor:pointer;margin-left:auto;white-space:nowrap}
.progrow{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:6px 0}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:12px;margin-bottom:8px}
.rcard{background:var(--surface);border:1px solid var(--bd-soft);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.rcard:hover{border-color:var(--bd-strong)}
.rc-h{display:flex;align-items:center;gap:8px;white-space:nowrap}
.rc-h .sp{flex:1}
.rc-meta{font-size:12px;color:var(--t3)}
.rc-cur{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--bd-soft);padding-top:8px}
.rc-node{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.rc-node svg{width:64px;height:16px}
.rc-f{display:flex;gap:6px;padding-top:4px}
.rcard .progrow .lab{width:auto;min-width:72px;max-width:200px}
.progrow .lab{width:92px;color:var(--t2);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.curnode{border:1px solid var(--accent-line);border-radius:10px;padding:10px 12px;background:rgba(44,196,240,.04)}
.curnode .r1{display:flex;align-items:center;gap:8px}
.minilog{background:var(--sunk);border:1px solid var(--bd-soft);border-radius:8px;padding:6px 0;font:12px/1.6 var(--mono)}
.minilog div{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- full-screen pages ---------- */
.fs{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.ws{position:absolute;inset:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px}
.ws.panning{cursor:grabbing}
.ws.hand{cursor:grab}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.grp{position:absolute;display:flex;align-items:center;gap:6px;background:var(--surface-a);border:1px solid var(--bd-soft);border-radius:var(--r4);padding:5px;box-shadow:var(--float);z-index:10}
.grp .div{width:1px;height:20px;background:var(--bd);margin:0 2px}
.g-tl{left:12px;top:12px}.g-tr{right:12px;top:12px}
.dock{left:50%;bottom:14px;transform:translateX(-50%)}
.dock .add{width:32px;height:32px;border-radius:50%;background:var(--raised-2);color:var(--t1);border:1px solid var(--bd-strong);display:grid;place-items:center;cursor:pointer}
.dock .zoom{min-width:52px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--t2)}
.tool{width:30px;height:30px;border-radius:7px;border:0;background:transparent;color:var(--t2);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.tool:hover{background:var(--raised);color:var(--t1)}
.tool.on{background:var(--raised-2);color:var(--t1)}
.oname{font-weight:600;padding:0 4px;white-space:nowrap}
.ver{font-family:var(--mono);font-size:12px;color:var(--t3)}
.mm{position:absolute;left:12px;bottom:14px;width:188px;height:118px;background:var(--surface-a);border:1px solid var(--bd-soft);border-radius:var(--r4);box-shadow:var(--float);z-index:10;padding:6px;cursor:pointer}
.mm svg{width:100%;height:100%}
.insp{position:absolute;right:12px;top:62px;bottom:14px;width:372px;background:var(--surface-a);border:1px solid var(--bd-soft);border-radius:var(--r4);box-shadow:var(--float);z-index:10;display:flex;flex-direction:column;overflow:hidden}
.insp-h{padding:12px 14px 10px;border-bottom:1px solid var(--bd-soft)}
.insp-h .row1{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t3)}
.insp-h h2{font-size:15px;margin:6px 0 2px;font-weight:600}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--bd-soft);flex:none}
.tabs button{border:0;background:transparent;color:var(--t2);padding:9px 10px 8px;font-size:12.5px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--t1);border-bottom-color:var(--white)}
.tabs button sup{font-size:10px;color:var(--t3);margin-left:2px}
.insp-b{flex:1;overflow:auto;padding:12px 14px}
.combo{position:absolute;top:34px;left:0;right:0;background:var(--raised);border:1px solid var(--bd-strong);border-radius:var(--r3);box-shadow:var(--pop);padding:4px;z-index:20;max-height:260px;overflow:auto}
.combo .g{font-size:11px;color:var(--t3);padding:6px 8px 3px}
.combo .o{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:12px}
.combo .o .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo .o .src{font-size:11px;color:var(--t3)}
.combo .o.act,.combo .o:hover{background:var(--raised-2)}
.lane{position:absolute;left:0;top:-30px;font-size:12px;color:var(--t3);display:flex;gap:10px;align-items:center;white-space:nowrap}
.lane b{color:var(--t2);font-weight:500}
.n{position:absolute;width:208px;height:112px;background:var(--raised);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;transition:box-shadow .15s var(--ease),border-color .15s var(--ease),opacity .2s}
.n:hover{border-color:var(--bd-strong)}
.n.sel{border-color:var(--sel);box-shadow:0 0 0 4px var(--sel-ring)}
.nh{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--t3);white-space:nowrap}
.chip{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font:600 9px var(--mono);flex:none}
.nid{font-family:var(--mono);color:var(--t2);overflow:hidden;text-overflow:ellipsis}
.nst{margin-left:auto}
.nt{font-size:13.5px;font-weight:600;margin:8px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot{background:var(--sunk);border-radius:6px;padding:5px 8px;font:12px var(--mono);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.slot svg{width:54px;height:14px;flex:none;margin-left:auto}
.ntags{position:absolute;right:10px;top:-10px;display:flex;gap:4px}
.ntag{height:19px;padding:0 6px;border-radius:5px;background:var(--raised-2);border:1px solid var(--bd);font:11px/17px var(--mono);color:var(--t2)}
.ntag.always{color:#e6c37a;border-color:rgba(240,168,58,.35)}
.p{position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--bg);border:1.5px solid #5f5f5f}
.p.l{left:-5px}.p.r{right:-5px}
.p.on{background:#6e6e6e;border-color:#6e6e6e}
.p.off{border-style:dashed}
.p.d{left:50%;top:auto;bottom:-6px;margin:0 0 0 -5px;border-radius:2px;transform:rotate(45deg);border-color:var(--accent);background:var(--bg)}
.n[data-run=done]{opacity:.72}
.n[data-run=running]{border-color:var(--accent)}
.n[data-run=failed]{border-color:var(--danger)}
.n[data-run=skipped],.n[data-run=none],.n[data-run=pending]{opacity:.55}
.n[data-run=cancelled]{opacity:.6;border-style:dashed;border-color:#7a7a7a}
.n.sel[data-run]{opacity:1}
.region{position:absolute;border:1px dashed rgba(180,163,248,.45);border-radius:var(--r4);background:linear-gradient(135deg,rgba(180,163,248,.07),rgba(44,196,240,.045))}
.region-h{position:absolute;left:14px;top:9px;right:14px;font-size:12px;color:#c9bdfb;display:flex;gap:8px;align-items:center;white-space:nowrap}
.region-h .mono{color:#b4a3f8}
.region-h .m{margin-left:auto;color:var(--t3)}
.dtag{position:absolute;padding:1px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--accent-line);color:var(--accent-hi);font:11px/16px var(--mono);white-space:nowrap}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.e{fill:none;stroke:#474747;stroke-width:1.5}
.e.hl{stroke:#cfcfcf;stroke-dasharray:6 5;animation:flow 1s linear infinite}
.e.live{stroke:var(--accent);stroke-width:1.75}
.e.disp{stroke:var(--accent-line);stroke-dasharray:4 4}
.e.sub{stroke-dasharray:4 4}
.e.fail{stroke:rgba(239,83,80,.7)}
.world.lod .slot,.world.lod .ntags,.world.lod .nh .ty{display:none}
.world.lod .nt{font-size:calc(12px / var(--s));margin-top:calc(6px / var(--s))}
.world.lod .nh{font-size:calc(11px / var(--s))}
.world.lod .region-h,.world.lod .lane,.world.lod .dtag{font-size:calc(11.5px / var(--s))}
/* ---------- monitor ---------- */
.mon-top{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--bd-soft);background:var(--surface)}
.mon-top .sp{flex:1}
.mon-top .div{width:1px;height:20px;background:var(--bd)}
.runsel{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:7px;background:var(--raised);border:1px solid var(--bd);cursor:pointer;white-space:nowrap}
.runsel:hover{background:var(--raised-2)}
.tl{flex:none;border-bottom:1px solid var(--bd-soft);background:var(--bg);position:relative}
.tl-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--bd-soft)}
.tl-bar .sp{flex:1}
.tl-body{overflow:auto;position:relative;scroll-snap-type:y proximity;scroll-padding-top:22px;-webkit-mask-image:linear-gradient(#000 calc(100% - 14px),transparent);mask-image:linear-gradient(#000 calc(100% - 14px),transparent)}
.tl-row{scroll-snap-align:start;display:grid;grid-template-columns:272px 1fr;align-items:center;height:26px;border-bottom:1px solid rgba(255,255,255,.03)}
.tl-row.chain{height:30px;background:rgba(255,255,255,.015)}
.tl-row.sel{background:rgba(255,255,255,.05)}
.tl-row .lab{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;font-size:12px;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:0}
.tl-row .lab .nm{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.tl-row .lab .mono.nm{flex:none}
.tl-row .lab .t3.nm{flex:1 1 0}
.tl-row .lab .du{margin-left:auto;font:11px var(--mono);color:var(--t3);min-width:52px;text-align:right;flex:none}
.tl-row.node .lab{padding-left:30px}
.tl-row .lab .tw{width:14px;color:var(--t3);flex:none;display:grid;place-items:center}
.track{position:relative;height:100%;margin-right:14px}
.sg{position:absolute;top:7px;height:12px;border-radius:3px;min-width:2px;cursor:pointer}
.tl-row.chain .sg{top:9px;height:12px}
.sg.ok{background:rgba(91,214,154,.5)}
.sg.run{background:var(--accent)}
.sg.run.live::after{content:"";position:absolute;right:-3px;top:-2px;width:6px;height:16px;border-radius:3px;background:var(--accent);animation:pulse 1.6s infinite}
.sg.fail{background:var(--danger)}
.sg.cancel{background:repeating-linear-gradient(135deg,rgba(154,154,154,.5) 0 3px,rgba(154,154,154,.15) 3px 6px)}
.sg.queue{background:repeating-linear-gradient(135deg,#555 0 3px,#2e2e2e 3px 6px);box-shadow:inset 0 0 0 1px #4a4a4a}
.sg.wait{background:repeating-linear-gradient(135deg,rgba(240,168,58,.4) 0 3px,rgba(240,168,58,.12) 3px 6px)}
.sg.skip{background:transparent;box-shadow:inset 0 0 0 1px #444}
.sg.sel{outline:1.5px solid var(--sel);outline-offset:1px}
.tl-axis{display:grid;grid-template-columns:272px 1fr;height:22px;border-bottom:1px solid var(--bd-soft);position:sticky;top:0;background:var(--bg);z-index:3}
.tl-axis .ticks{position:relative;margin-right:14px}
.tick{position:absolute;top:4px;font:10.5px var(--mono);color:var(--t3);transform:translateX(-50%);white-space:nowrap}
.tl-lines{position:absolute;left:272px;right:14px;top:22px;bottom:0;pointer-events:none}
.tl-lines i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.04)}
.xh-v{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55);pointer-events:none;z-index:4;display:none}
.mk-v{position:absolute;top:0;bottom:0;width:0;margin-left:1px;border-left:1.5px dashed var(--warn);pointer-events:none;z-index:4}
.now-v{position:absolute;top:0;bottom:0;width:1px;background:var(--accent-line);pointer-events:none;z-index:2}
.brush{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.07);border-left:1px solid rgba(255,255,255,.4);border-right:1px solid rgba(255,255,255,.4);pointer-events:none;z-index:3}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--t3);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend b{width:14px;height:8px;border-radius:2px;display:inline-block}
.mon-main{flex:1;min-height:0;display:flex;flex-direction:column}
.wsp{flex:1;min-height:240px;overflow:auto;padding:10px 12px 28px;-webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);mask-image:linear-gradient(#000 calc(100% - 22px),transparent)}
.wsp-bar{display:flex;align-items:center;gap:8px;margin:-10px -12px 10px;padding:10px 12px 8px;flex-wrap:wrap;position:sticky;top:-10px;z-index:4;background:var(--bg);border-bottom:1px solid var(--bd-soft)}
.wsp-bar .sp{flex:1}
.scope{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:7px;border:1px solid var(--bd);background:var(--raised);font-size:12.5px}
.scope .x{width:20px;height:20px;border-radius:5px;border:0;background:transparent;color:var(--t3);cursor:pointer;display:grid;place-items:center}
.scope .x:hover{background:var(--raised-2);color:var(--t1)}
.kpis{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);padding-right:40px}
.kpi{flex:none;width:176px;background:var(--surface);border:1px solid var(--bd-soft);border-radius:9px;padding:8px 10px;cursor:pointer}
.kpi:hover{border-color:var(--bd-strong)}
.kpi.sel{border-color:var(--sel)}
.kpi .h{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t3);white-space:nowrap;overflow:hidden}
.kpi .h .mono{color:var(--t2);overflow:hidden;text-overflow:ellipsis}
.kpi .v{font:600 16px/1.3 var(--mono);margin-top:3px;white-space:nowrap}
.kpi .v small{font-size:11px;color:var(--t3);font-weight:400;margin-left:3px}
.kpi .m{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi svg{display:block;width:100%;height:20px;margin-top:3px}
.grp-sec{border:1px solid var(--bd-soft);border-radius:10px;margin-bottom:10px;background:var(--surface);scroll-margin-top:56px}
.grp-h{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;user-select:none}
.grp-h .tw{color:var(--t3);width:14px;display:grid;place-items:center}
.grp-h .nm{font-weight:500}
.grp-h .sp{flex:1}
.grp-b{padding:0 10px 10px;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grp-b.dense{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grp-b .wide-row{grid-column:1/-1}
.grp-b .wide-row .panel{margin-bottom:0!important}
.grp-sec.sel{border-color:var(--sel)}
.grp-h .gt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pm{display:inline-flex;align-items:center;gap:6px;margin-left:12px;padding:0 8px;height:22px;border-radius:6px;background:var(--sunk);font-size:12px;white-space:nowrap}
.pm b{font-weight:600}
.pm svg{width:56px;height:16px}
.scope.on{border-color:var(--sel)}
button.scope{cursor:pointer;padding-right:8px;gap:6px;color:var(--t1)}
button.scope:hover{background:var(--raised-2)}
.menu.nf{padding:8px;display:flex;flex-direction:column}
.menu.nf .inp{margin:0 0 8px;width:100%}
.nf-quick{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;margin-bottom:8px}
.nf-quick .t3{margin-right:4px}
.nf-list{flex:1;min-height:0;overflow:auto;-webkit-mask-image:linear-gradient(#000 calc(100% - 16px),transparent);mask-image:linear-gradient(#000 calc(100% - 16px),transparent);border-top:1px solid var(--bd-soft);border-bottom:1px solid var(--bd-soft);padding:4px 0}
.nf-g{padding:2px 0}
.nf-row{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 22px;border-radius:5px;cursor:pointer;font-size:12.5px}
.nf-row:hover{background:var(--raised-2)}
.nf-row.nf-ch{padding-left:6px}
.nf-row input{accent-color:#d6d6d6;margin:0;width:auto;flex:none}
.nf-row .nfl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nf-foot{display:flex;align-items:center;gap:8px;padding-top:8px;font-size:12px}
.tl-drag,.bp-drag{position:absolute;left:0;right:0;height:9px;cursor:row-resize;z-index:6}
.tl-drag{bottom:-5px}
.tl-drag::after,.bp-drag::after{content:"";position:absolute;left:50%;top:3px;width:40px;height:3px;margin-left:-20px;border-radius:2px;background:var(--bd-strong);opacity:.55;transition:opacity .15s}
.tl-drag:hover::after,.bp-drag:hover::after,.tl-drag.on::after,.bp-drag.on::after{opacity:1}
.tl-drag:hover,.bp-drag:hover{background:linear-gradient(transparent 3px,rgba(255,255,255,.06) 3px,rgba(255,255,255,.06) 6px,transparent 6px)}
.ch{background:var(--bg);border:1px solid var(--bd-soft);border-radius:8px;padding:8px 10px 6px;position:relative;min-width:0}
.ch.wide{grid-column:1/-1}
.ch-h{display:flex;align-items:baseline;gap:8px;font-size:12px;white-space:nowrap}
.ch-h .ti{color:var(--t2);overflow:hidden;text-overflow:ellipsis}
.ch-h .vv{margin-left:auto;font:600 13px var(--mono);color:var(--t1)}
.ch-h .vv small{font-weight:400;font-size:11px;color:var(--t3);margin-left:2px}
.ch-h .hv{font:11px var(--mono);color:var(--t3)}
.ch svg.plot{display:block;width:100%;height:96px;margin-top:4px;cursor:crosshair}
.grp-b.dense .ch svg.plot{height:56px}
.ch .yl{position:absolute;right:12px;font:10px var(--mono);color:var(--t3);opacity:.7;pointer-events:none}
.ch .nodata{height:96px;display:grid;place-items:center;font-size:12px;color:var(--t3);border:1px dashed var(--bd-soft);border-radius:6px;margin-top:4px}
.grp-b.dense .ch .nodata{height:56px}
.ch .ser{display:flex;gap:10px;font-size:11px;color:var(--t3);margin-top:2px}
.ch .ser i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:4px}
.stat-big{font:600 26px/1.1 var(--mono);margin:6px 0 2px}
.stat-big small{font-size:12px;color:var(--t3);font-weight:400;margin-left:4px}
.bp{flex:none;border-top:1px solid var(--bd-soft);background:var(--surface);display:flex;flex-direction:column;position:relative}
.bp-drag{top:-5px}
.bp .tabs{padding-left:6px}
.bp-tools{margin-left:auto;display:flex;align-items:center;gap:6px;padding:4px 8px}
.bp-b{flex:1;min-height:0;overflow:auto;box-shadow:inset 0 8px 8px -8px rgba(0,0,0,.8)}
.lg{font:12px/20px var(--mono);padding-top:4px}
.lg div{display:grid;grid-template-columns:74px 44px 104px 1fr;gap:8px;padding:0 12px;white-space:pre-wrap;word-break:break-all;cursor:pointer}
.lg div:hover{background:rgba(255,255,255,.03)}
.lg div.mk{background:rgba(240,168,58,.08)}
.lg .ts{color:var(--t3)}
.lg .nd{color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-INFO{color:var(--t2)}.lv-WARN{color:var(--warn)}.lv-ERR{color:var(--danger)}.lv-DBG{color:var(--t3)}
.att{border:1px solid var(--bd-soft);border-radius:var(--r3);padding:10px 12px;margin-bottom:8px;background:var(--raised)}
.att.fail{border-color:rgba(239,83,80,.4)}
.att pre{margin:8px 0 0;background:var(--sunk);border-radius:6px;padding:8px;font:11.5px/1.5 var(--mono);color:var(--t2);max-height:140px;overflow:auto;white-space:pre-wrap}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--bd-soft);border-radius:var(--r3);margin-bottom:6px;background:var(--raised)}
pre.json{margin:0;background:var(--sunk);border:1px solid var(--bd-soft);border-radius:8px;padding:10px;font:12px/1.55 var(--mono);color:var(--t2);white-space:pre-wrap}
.live-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;border:1px solid var(--accent-line);color:var(--accent-hi);font-size:12px;cursor:pointer;background:transparent}
.live-pill.off{border-color:var(--bd);color:var(--t2)}
/* overlays */
.ov-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.dlg{width:520px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--bd);border-radius:var(--r4);box-shadow:var(--pop);overflow:hidden}
.dlg-h{padding:16px 18px 6px}
.dlg-h h3{margin:0;font-size:15px;font-weight:600}
.dlg-h p{margin:6px 0 0;color:var(--t2);font-size:12.5px}
.dlg-b{padding:10px 18px 4px;max-height:60vh;overflow:auto}
.dlg-f{padding:12px 18px 16px;display:flex;justify-content:flex-end;gap:8px;align-items:center}
.cmdk{width:620px}
.cmdk input{border:0;border-bottom:1px solid var(--bd-soft);border-radius:0;height:48px;font-size:14px;background:transparent;padding:0 16px}
.cmdk input:focus{box-shadow:none}
.cmdk .res{max-height:380px;overflow:auto;padding:6px}
.cmdk .g{font-size:11px;color:var(--t3);padding:8px 10px 4px}
.cmdk .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}
.cmdk .it.act{background:var(--raised-2)}
.cmdk .it .r{margin-left:auto;display:flex;gap:4px;color:var(--t3);font-size:11.5px}
.cmdk .foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--bd-soft);color:var(--t3);font-size:11.5px}
.keys{width:740px}
.keys .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 24px;padding:4px 18px 18px}
.keys h4{grid-column:1/-1;margin:12px 0 4px;font-size:12px;color:var(--t3);font-weight:500}

function thumbStates(sc){
 const n=sc.shape.main,subs=sc.shape.subs;
 const R=RUNLIST.find(r=>r.id===sc.run);
 const mk=(len,fn)=>Array.from({length:len},(_,i)=>fn(i));
 if(!R)return {main:mk(n,()=>'pending'),subs:subs.map(l=>mk(l,()=>'pending'))};
 if(R.s==='ok')return {main:mk(n,()=>'done'),subs:subs.map(l=>mk(l,()=>'done'))};
 if(R.id==='0194692f'){const r=RUNS['0194692f'];return {main:r.chains[0].nodes.map(x=>nodeState(x,r.T)),subs:[r.chains[1].nodes.map(x=>nodeState(x,r.T))]}}
 if(R.id==='b7e2a91c'){const r=RUNS['b7e2a91c'];return {main:r.chains[0].nodes.map(x=>nodeState(x,r.T)),subs:r.chains.slice(1).map(c=>c.nodes.map(x=>nodeState(x,r.T)))}}
 if(R.s==='fail')return {main:mk(n,i=>i<3?'done':i===3?'failed':i===n-1?'done':'skipped'),subs:subs.map(l=>mk(l,()=>'none'))};
 if(R.s==='cancel')return {main:mk(n,i=>i<7?'done':i===n-1?'done':'cancelled'),subs:subs.map(l=>mk(l,i=>i<2?'done':'cancelled'))};

const COL={done:'#3f6b55',running:'#2cc4f0',failed:'#ef5350',cancelled:'#555',skipped:'#2a2a2a',none:'#2a2a2a',pending:'#3a3a3a',waiting:'#7a5a26',queued:'#3a3a3a'};
function thumbSVG(sc){
 const st=thumbStates(sc);const n=sc.shape.main;const per=n>10?9:5;const rows=Math.ceil(n/per);
 const W=300,nodeW=Math.min(44,(W-(per-1)*8)/per),nodeH=18,gx=(W-per*nodeW)/(per-1||1);
 let y=4,out='';
 const subs=sc.shape.subs;
 const totalH=rows*(nodeH+14)+(subs.length?subs.length*(nodeH+16)+8:0);
 const H=Math.max(totalH,90);
 const pos=[];
 for(let i=0;i<n;i++){const r=Math.floor(i/per),c=i%per;const x=(r%2===0?c:per-1-c)*(nodeW+gx);pos.push([x,y+r*(nodeH+14)])}
 for(let i=0;i<n-1;i++){const [x1,y1]=pos[i],[x2,y2]=pos[i+1];if(y1===y2){const a=x1<x2?x1+nodeW:x1,b=x1<x2?x2:x2+nodeW;out+=`<line x1="${a}" y1="${y1+nodeH/2}" x2="${b}" y2="${y2+nodeH/2}" stroke="#4a4a4a" stroke-width="1.2"/>`}else{const ex=x1+(pos[i][0]>W/2?nodeW:0);out+=`<path d="M${ex} ${y1+nodeH/2} C${ex+(ex>W/2?12:-12)} ${y1+nodeH/2}, ${ex+(ex>W/2?12:-12)} ${y2+nodeH/2}, ${ex} ${y2+nodeH/2}" fill="none" stroke="#4a4a4a" stroke-width="1.2"/>`}}
 pos.forEach(([x,yy],i)=>{const s=st.main[i]||'pending';out+=`<rect x="${x}" y="${yy}" width="${nodeW}" height="${nodeH}" rx="4" fill="${COL[s]}" ${s==='skipped'||s==='none'?'stroke="#444" stroke-width="1"':''} ${s==='running'?'stroke="#7fdcf7" stroke-width="1.2"':''}/>`});
 let sy=y+rows*(nodeH+14)+4;
 subs.forEach((len,si)=>{const sw=len*(nodeW*.8)+(len-1)*8;const sx=W-sw-6;out+=`<rect x="${sx-8}" y="${sy-5}" width="${sw+16}" height="${nodeH*.8+10}" rx="6" fill="rgba(180,163,248,.07)" stroke="rgba(180,163,248,.45)" stroke-dasharray="3 3"/>`;for(let j=0;j<len;j++){const s=(st.subs[si]||[])[j]||'pending';const x=sx+j*(nodeW*.8+8);out+=`<rect x="${x}" y="${sy}" width="${nodeW*.8}" height="${nodeH*.8}" rx="3" fill="${COL[s]}" ${s==='running'?'stroke="#7fdcf7" stroke-width="1.2"':''} ${s==='skipped'||s==='none'?'stroke="#444"':''}/>`;if(j<len-1)out+=`<line x1="${x+nodeW*.8}" y1="${sy+nodeH*.4}" x2="${x+nodeW*.8+8}" y2="${sy+nodeH*.4}" stroke="#4a4a4a"/>`}
  const d=pos[Math.min(sc.shape.dispatchAt||0,n-1)];out+=`<path d="M${d[0]+nodeW/2} ${d[1]+nodeH} C${d[0]+nodeW/2} ${sy+nodeH*.4}, ${sx-30} ${sy+nodeH*.4}, ${sx} ${sy+nodeH*.4}" fill="none" stroke="rgba(44,196,240,.5)" stroke-dasharray="3 3"/>`;
  sy+=nodeH+16});
 return `<svg viewBox="-2 0 ${W+4} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${out}</svg>`;
}

/* ============ metrics series ============ */
function val(c,si,t){
 const s=c.ser[si];const seed=hash(c.id+':'+si);const nz=noise(seed,t);
 switch(s.k){
  case 'rate':return Math.max(0,s.base+nz*s.amp);
  case 'lat':{let v=s.base+nz*s.amp*.6;if(s.spike&&(hash(seed+'s'+Math.floor(t/7))%23===0))v+=s.amp*3.2;return Math.max(0.1,v)}
  case 'mem':return Math.max(0,s.base+Math.sin(t*0.02+seed%9)*s.amp+nz*s.amp*.25);
  case 'err':return Math.max(0,Math.round(s.base+nz*s.amp));
  case 'pct':return Math.min(100,s.base+nz*1.2);
  case 'pctlow':return Math.max(0,s.base+nz*s.amp);
  case 'cnt':return s.base;
 }
 return 0;
}
function nodeOf(id){for(const R of Object.values(RUNS))for(const c of R.chains)for(const n of c.nodes)if(n.id===id||n.charts.some(x=>x===id))return n;return null}
function series(c,r0,r1,si,R){
 R=R||RUNS[S.run];const n=R.chains.flatMap(ch=>ch.nodes).find(x=>x.charts.includes(c.id));if(!n)return [];
 const sp=runSpan(n,R.T);if(!sp)return [];
 const a=Math.max(r0,sp[0]),b=Math.min(r1,sp[1]);if(b<=a)return [];
 const N=Math.min(160,Math.max(2,Math.ceil(b-a)));const step=(b-a)/(N-1);const out=[];
 const s=c.ser[si||0];
 for(let i=0;i<N;i++){const t=a+i*step;let v=val(c,si||0,t);if(s.k==='cnt'){v=s.base*Math.min(1,(t-sp[0])/Math.max(1,(sp[1]-sp[0])))*(nodeState(n,R.T)==='running'?0.6+0.4*((t-sp[0])/Math.max(1,R.T-sp[0])):1)}if(s.k==='pct'&&s.base===0)v=0;out.push([t,v])}
 return out;
}

function availRect(){const ws=$('#ws');const W=ws.clientWidth,H=ws.clientHeight;const right=S.insp?396:12;return {x:12,y:64,w:W-12-right,h:H-64-72}}
function fit(){const a=availRect();const ww=WORLD.x1-WORLD.x0,wh=WORLD.y1-WORLD.y0;S.s=Math.min(a.w/ww,a.h/wh,1.15);S.tx=a.x+(a.w-ww*S.s)/2-WORLD.x0*S.s;S.ty=a.y+(a.h-wh*S.s)/2-WORLD.y0*S.s;apply()}
function apply(){const w=$('#world');if(!w)return;w.style.transform=`translate(${S.tx}px,${S.ty}px) scale(${S.s})`;w.style.setProperty('--s',S.s);w.classList.toggle('lod',S.s<0.95);const z=$('#zoom');if(z)z.textContent=Math.round(S.s*100)+'%';const vp=$('#mmvp');if(vp){const ws=$('#ws');vp.setAttribute('x',(-S.tx)/S.s);vp.setAttribute('y',(-S.ty)/S.s);vp.setAttribute('width',ws.clientWidth/S.s);vp.setAttribute('height',ws.clientHeight/S.s)}}
function zoomAt(f,cx,cy){const ns=Math.max(0.3,Math.min(2,S.s*f));S.tx=cx-(cx-S.tx)*(ns/S.s);S.ty=cy-(cy-S.ty)*(ns/S.s);S.s=ns;apply()}
function focusNode(id){const n=eById[id];if(!n)return;const a=availRect();S.tx=a.x+a.w/2-(n.x+104)*S.s;S.ty=a.y+a.h/2-(n.y+56)*S.s;apply()}
function bindCanvas(){const ws=$('#ws');let drag=null;ws.addEventListener('wheel',e=>{e.preventDefault();const r=ws.getBoundingClientRect();zoomAt(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top)},{passive:false});ws.addEventListener('pointerdown',e=>{if(e.target.closest('.n,.grp,.insp,.mm,.menu'))return;if(S.addOpen){S.addOpen=false;render();return}drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty};ws.classList.add('panning');(()=>{try{ws.setPointerCapture(e.pointerId)}catch(_){}})()});ws.addEventListener('pointermove',e=>{if(!drag)return;S.tx=drag.tx+e.clientX-drag.x;S.ty=drag.ty+e.clientY-drag.y;apply()});ws.addEventListener('pointerup',()=>{ws.classList.remove('panning');drag=null})}

/* ============ routing & render ============ */
function go(h){if(location.hash===h)route();else location.hash=h}
function route(){
 const raw=location.hash.replace(/^#\//,'')||'dashboard';const [path,qs]=raw.split('?');const parts=path.split('/');
 const params=new URLSearchParams(qs||'');
 const prev=S.route+S.param;
 S.route=parts[0];S.param=parts[1]||null;S.menuHTML=null;S.menu=null;if(!S._keepDrawer)S.drawer=null;S._keepDrawer=false;
 if(S.route==='monitor'){if(S.param&&RUNS[S.param]&&S.run!==S.param){S.run=S.param;S.range=null;S.markT=null;S.opened={};S.mSel=null;S.nodeFilter=null;S.menu=null;const fr=allNodes(RUNS[S.run]).find(n=>n.charts.length&&['running','failed'].includes(nodeState(n,RUNS[S.run].T)));S._scrollTo=fr?fr.id:null}const nd=params.get('node');if(nd)S.mSel=nd}
 if(S.route==='editor'){S.editorRun=params.get('run')||(S.param==='s1'?'0194692f':'0194692f');if(params.get('run'))S.mode='run';if(prev!==S.route+S.param)S.fitted=false}
 render();
}
function crumbFor(){const m={dashboard:'控制台',scenarios:'场景编排',runs:'运行记录',agents:'Agent 管理',packages:'节点包管理'};return `<span>sfly</span>${I.chevr}<b>${m[S.route]||''}</b>`}
function render(){

function setHover(t){
 S.hoverT=t;const R=RUNS[S.run];
 document.querySelectorAll('svg.plot').forEach(svg=>{const r0=+svg.dataset.r0,r1=+svg.dataset.r1;const l=svg.querySelector('.xh');if(!l)return;if(t==null||t<r0||t>r1){l.setAttribute('x1',-10);l.setAttribute('x2',-10);return}const x=(t-r0)/(r1-r0)*300;l.setAttribute('x1',x);l.setAttribute('x2',x);
  const cid=svg.dataset.cid;const c=CH[cid];const hv=document.getElementById('hv-'+cid.replace('.','_'));if(hv&&c&&c.ty!=='stat'){let v=null;if(cid.startsWith('__'))v=val(c,0,t);else{const d=series(c,t-1,t+1,c.pk||0,R);v=d.length?d[0][1]:null}hv.textContent=v==null?'':clock(R.start,t)+'  '+fmtNum(v)}});
 const xh=$('#tl-xh');if(xh){const [r0,r1]=curRange(R);if(t==null||t<r0||t>r1)xh.style.display='none';else{xh.style.display='block';xh.style.left=((t-r0)/(r1-r0)*100)+'%'}}
 if(t==null)document.querySelectorAll('.hv').forEach(h=>{if(h.id)h.textContent=''});
}
function bindMonitor(){
 const R=RUNS[S.run];
 document.querySelectorAll('svg.plot').forEach(svg=>{svg.addEventListener('mousemove',e=>{const rc=svg.getBoundingClientRect();const f=(e.clientX-rc.left)/rc.width;setHover(+svg.dataset.r0+f*(+svg.dataset.r1-+svg.dataset.r0))});svg.addEventListener('mouseleave',()=>setHover(null))});
 const rows=$('#tl-rows');if(rows){
  const trackFrac=e=>{const tr=rows.querySelector('.track');const rc=tr.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-rc.left)/rc.width))};
  let b=null;
  rows.addEventListener('mousemove',e=>{const [r0,r1]=curRange(R);if(e.target.closest('.lab')){setHover(null);return}const f=trackFrac(e);setHover(r0+f*(r1-r0));if(b){const br=$('#tl-brush');const a=Math.min(b.f,f),z=Math.max(b.f,f);if(Math.abs(f-b.f)>.004){b.moved=true;br.style.display='block';br.style.left=a*100+'%';br.style.width=(z-a)*100+'%'}}});
  rows.addEventListener('mouseleave',()=>{if(!b)setHover(null)});
  rows.addEventListener('pointerdown',e=>{if(e.target.closest('.lab'))return;b={f:trackFrac(e),moved:false,node:e.target.closest('.sg')?.dataset.node};(()=>{try{ro(()=>{try{ws.setPointerCapture(e.pointerId)}catch(_){}})()}catch(_){}})()});
  rows.addEventListener('pointerup',e=>{if(!b)return;const [r0,r1]=curRange(R);const f=trackFrac(e);if(b.moved){const a=Math.min(b.f,f),z=Math.max(b.f,f);if(z-a>.01){S.range=[r0+a*(r1-r0),r0+z*(r1-r0)];b=null;render();return}}else if(b.node){selNode(b.node);b=null;return}b=null;$('#tl-brush')&&($('#tl-brush').style.display='none')});
 }
 const bp=$('#bp-b');if(bp)bp.addEventListener('scroll',()=>{S._logBottom=bp.scrollTop+bp.clientHeight>=bp.scrollHeight-8});
 const td=$('#tl-drag');if(td){td.addEventListener('pointerdown',e=>{const tb=$('#tl-body');const y0=e.clientY,h0=tb.clientHeight;try{td.setPointerCapture(e.pointerId)}catch(_){};td.classList.add('on');const mv=ev=>{S.tlH=Math.max(56,Math.min(window.innerHeight*.62,h0+ev.clientY-y0));tb.style.height=S.tlH+'px';tb.style.maxHeight='none'};const up=()=>{td.classList.remove('on');td.removeEventListener('pointermove',mv);td.removeEventListener('pointerup',up)};td.addEventListener('pointermove',mv);td.addEventListener('pointerup',up)});td.addEventListener('dblclick',()=>{S.tlH=null;render()})}
 const drag=$('#bp-drag');if(drag){drag.addEventListener('pointerdown',e=>{const y0=e.clientY,h0=S.bh;try{drag.setPointerCapture(e.pointerId)}catch(_){};const mv=ev=>{S.bh=Math.max(36,Math.min(window.innerHeight*.7,h0-(ev.clientY-y0)));$('#bp').style.height=S.bh+'px'};const up=()=>{drag.removeEventListener('pointermove',mv);drag.removeEventListener('pointerup',up)};drag.addEventListener('pointermove',mv);drag.addEventListener('pointerup',up)})}
 const q=$('#chq');if(q)q.addEventListener('input',e=>{S.chQ=e.target.value;const pos=e.target.selectionStart;render();const n=$('#chq');n.focus();n.setSelectionRange(pos,pos)});
}

 const tlc=t.closest('[data-tlc]');if(tlc){const k='tl:'+tlc.dataset.tlc;if(S.tlMode!=='expand'){S.tlMode='expand';S.collapsed={};R0().chains.forEach(c=>S.collapsed['tl:'+c.id]=c.id!==tlc.dataset.tlc)}else S.collapsed[k]=!S.collapsed[k];render();return}
 const nn=t.closest('[data-node]');if(nn&&S.route==='monitor'&&!t.closest('#tl-rows .track')){selNode(nn.dataset.node);return}
 const gp=t.closest('[data-grp]');if(gp){const id=gp.dataset.grp;const R=RUNS[S.run];const n=allNodes(R).find(x=>x.id===id);const cur=S.opened[id]!=null?S.opened[id]:(id==='__plat'?false:(S.mSel?true:['running','failed'].includes(nodeState(n,R.T))));S.opened[id]=!cur;if(!cur)S._scrollTo=id;render();return}
 const dn=t.closest('[data-dense]');if(dn){S.dense=dn.dataset.dense==='1';render();return}
 const bpt=t.closest('[data-bpt]');if(bpt){S.bpTab=bpt.dataset.bpt;if(S.bh<80)S.bh=240;S._logBottom=true;render();return}
 const lv=t.closest('[data-lv]');if(lv){S.lv=lv.dataset.lv;render();return}
 const lg=t.closest('[data-logt]');if(lg){S.markT=+lg.dataset.logt;S._logBottom=false;render();return}
 const a=t.closest('[data-act]');if(!a)return;S._ret=a;
 ({
  cmdk:()=>openOv('cmdk'),keys:()=>openOv('keys'),notes:()=>{S.notes=!S.notes;renderOv()},sb:()=>{S.sbCol=!S.sbCol;render()},
  newsc:()=>toast('ok','新建场景：自带一个入口节点（演示）'),
  closedrawer:()=>{S.drawer=null;renderOv();S._ret&&S._ret.focus&&S._ret.focus()},
  drawerTrigger:()=>{S.drawerStage='sum';S.run='0194692f';renderOv();toast('run','已触发运行 0194692f')},
  peek:()=>{S.secretShow=true;renderOv();setTimeout(()=>{S.secretShow=false;if(S.drawer)renderOv()},5000)},
  cancelRun:()=>{S.overlay='cancel';renderOv();setTimeout(()=>$('#cconf')&&$('#cconf').focus(),0)},
  doCancel:()=>{closeOv();toast('warn','正在取消：等待 always 节点清理完成…')},
  runmenu:()=>{S.menu=S.menu==='runs'?null:'runs';render()},
  resetRange:()=>{S.range=null;render()},
  nfmenu:()=>{if(S.menu==='nf'){S.menu=null}else{const rc=a.getBoundingClientRect();S._nfPos={x:rc.left,y:rc.bottom+4};S.menu='nf';S.nfQ=''}render();setTimeout(()=>$('#nfq')&&$('#nfq').focus(),0)},
  nfclear:()=>{S.nodeFilter=null;S.opened={};S._wspTop=true;render()},nfdone:()=>{S.menu=null;render()},clearSel:()=>{S.mSel=null;render()},
  expandAll:()=>{allNodes(RUNS[S.run]).forEach(n=>S.opened[n.id]=true);S.opened.__plat=true;render()},
  collapseAll:()=>{allNodes(RUNS[S.run]).forEach(n=>S.opened[n.id]=false);S.opened.__plat=false;render()},
  bpToggle:()=>{S.bh=S.bh>60?36:240;render()},
  save:()=>{S.dirty=false;render();toast(S.errMsg?'warn':'ok',S.errMsg?'已保存为 v4（带 1 条警告；触发前必须修复）':'已保存为 v4')},
  closeinsp:()=>{S.insp=false;render()},toggleinsp:()=>{S.insp=!S.insp;render()},mm:()=>{S.mm=!S.mm;render()},fit:()=>fit(),
  zin:()=>{const r=availRect();zoomAt(1.2,r.x+r.w/2,r.y+r.h/2)},zout:()=>{const r=availRect();zoomAt(1/1.2,r.x+r.w/2,r.y+r.h/2)},
  undo:()=>toast('ok','已撤销：修改 crunch.steps'),redo:()=>toast('ok','已重做'),tidy:()=>toast('ok','已整理布局，可撤销'),add:()=>{S.addOpen=!S.addOpen;render()}
 })[a.dataset.act]?.();
});
function R0(){return RUNS[S.run]}
document.addEventListener('input',e=>{
 if(e.target.id==='cmdq'){S.cmdQ=e.target.value;S.cmdIdx=0;const pos=e.target.selectionStart;renderOv();const q=$('#cmdq');q.focus();q.setSelectionRange(pos,pos)}
 if(e.target.id==='nfq'){S.nfQ=e.target.value;const pos=e.target.selectionStart;render();const n=$('#nfq');n.focus();n.setSelectionRange(pos,pos)}
 if(e.target.id==='cconf'){$('#cbtn').disabled=e.target.value.trim()!==RUNS[S.run].id.slice(0,4)}
 if(e.target.matches('[data-msg]')&&e.target.value&&S.errMsg){S.errMsg=false;S.dirty=true;const v=e.target.value;render();const el=document.querySelector('[data-msg]');el.value=v;el.focus()}
});
let gPending=false;
document.addEventListener('keydown',e=>{
 const typing=e.target.matches('input,textarea,select');
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.overlay==='cmdk'?closeOv():openOv('cmdk');return}
 if(S.overlay==='cmdk'){const items=cmdItems();if(e.key==='ArrowDown'){e.preventDefault();S.cmdIdx=Math.min(items.length-1,S.cmdIdx+1);renderOv();$('#cmdq').focus()}else if(e.key==='ArrowUp'){e.preventDefault();S.cmdIdx=Math.max(0,S.cmdIdx-1);renderOv();$('#cmdq').focus()}else if(e.key==='Enter'){const it=items[S.cmdIdx];closeOv();it&&it[3]()}else if(e.key==='Escape')closeOv();return}
 if(S.overlay||S.drawer){if(e.key==='Escape'){if(S.overlay)closeOv();else{S.drawer=null;renderOv()}}if(e.key==='Tab'){const root=S.overlay?'#ov [role=dialog]':'#ov .drawer';const f=[...document.querySelectorAll(root+' :is(button,input,select,a[href],a[data-go]):not([disabled])')];if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}}return}
 if(e.key==='Escape'){if(S.menuHTML){S.menuHTML=null;renderOv()}else if(S.menu){S.menu=null;render()}else if(S.route==='monitor'&&S.mSel){S.mSel=null;render()}else if(S.refOpen||S.addOpen){S.refOpen=null;S.addOpen=false;render()}else if(S.notes){S.notes=false;renderOv()}return}
 if(typing)return;
 if(e.key==='?'){openOv('keys');return}
 if(gPending){gPending=false;const m={d:'dashboard',s:'scenarios',r:'runs',a:'agents',p:'packages'}[e.key.toLowerCase()];if(m){go('#/'+m);return}}
 if(e.key.toLowerCase()==='g'&&!e.ctrlKey&&!e.metaKey){gPending=true;setTimeout(()=>gPending=false,900);return}
 const k=e.key;
 if(S.route==='monitor'){
  const R=RUNS[S.run];const ns=allNodes(R);
  if(k==='t'||k==='T'){S.tlMode=S.tlMode==='expand'?'sum':'expand';render()}
  else if(k==='l'||k==='L'){S.range=null;render()}
  else if(k==='d'||k==='D'){S.dense=!S.dense;render()}
  else if(k==='b'||k==='B'){S.bh=S.bh>60?36:240;render()}
  else if(k==='j'||k==='k'||k==='J'||k==='K'){const i=ns.findIndex(n=>n.id===S.mSel);const ni=Math.max(0,Math.min(ns.length-1,(i<0?0:i+(k.toLowerCase()==='j'?1:-1))));S.mSel=ns[ni].id;S.opened[S.mSel]=true;render()}
  return;
 }
 if(S.route!=='editor')return;
 if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='s'){e.preventDefault();S.dirty=false;render();toast('ok','已保存为 v4');return}
 if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){e.preventDefault();toast('ok',e.shiftKey?'已重做':'已撤销');return}
 if(e.altKey&&e.shiftKey&&k.toLowerCase()==='f'){e.preventDefault();toast('ok','已整理布局，可撤销');return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(k==='e'||k==='E'){S.mode='edit';render()}
 else if(k==='r'||k==='R'){S.mode='run';render()}
 else if(k==='0')fit();
 else if(k==='m'||k==='M'){S.mm=!S.mm;render()}
 else if(k==='i'||k==='I'){S.insp=!S.insp;render()}
 else if(k==='Tab'&&S.mode==='edit'){e.preventDefault();S.addOpen=true;render();setTimeout(()=>{const q=document.querySelector('[data-addq]');q&&q.focus()},0)}
 else if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();const list=ESS.includes(S.sel)?ESS:EMS;const i=list.indexOf(S.sel);S.sel=list[Math.max(0,Math.min(list.length-1,i+(k==='ArrowRight'?1:-1)))];render();focusNode(S.sel)}
});
window.addEventListener('hashchange',route);
window.addEventListener('resize',()=>{if(S.route==='editor')fit();else if(S.route==='monitor')render()});
route();
