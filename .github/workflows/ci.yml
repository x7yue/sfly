name: CI

on:
  push:
    branches: [main, "spec/**", "impl/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # main 上每个提交都要跑完：发布前会检查 tag 指向的提交在 main 上的 CI 已通过（release.yml）。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 每一步都只调用仓库根目录的统一命令（与本地完全一致，见 package.json scripts）。
jobs:
  check:
    # 账户账单里的 Actions 额度用尽后托管 runner 不再启动，CI 接到自托管 runner 上。
    # 需要先注册一台带 `sfly-ci` 标签的 Linux runner（docker 里跑，container / service 作业需要）。
    runs-on: [self-hosted, linux, sfly-ci]
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sfly
          POSTGRES_PASSWORD: sfly
          POSTGRES_DB: sfly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://sfly:sfly@127.0.0.1:5432/sfly
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking 需要基线提交

      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # 打包后的控制面带两个架构的 musl Agent（ADR 0011）；aarch64 用 rust-lld 交叉编译。
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3 # agent/build.rs 需要 protoc
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6 # Python 版本取自 .python-version

      - name: Install
        run: pnpm bootstrap
      - name: Versions are consistent
        run: pnpm release:version check
      - name: Generated code is up to date
        run: pnpm gen:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Protobuf breaking check
        run: pnpm proto:breaking
        env:
          PROTO_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      # 含验收场景 S1–S3（apps/server/test/acceptance-s*.test.ts，真实控制面 + Agent + SDK），
      # 以及标准节点包 sfly-std 的测试与节点包元信息检查（std/tests）。
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # 发布用的单文件控制面和镜像（ADR 0010、0011）：用打包后的控制面提供的 install.sh 安装 Agent 并跑通一条链，
      # 上一个 Release 的 Agent 在它上面跑完任务后自更新，镜像能启动、通过健康检查并带着两个架构的 Agent。
      - name: Pack agents
        run: pnpm pack:agents
      - name: Bundle control plane
        run: pnpm bundle:server
      # 跨版本自更新（ADR 0014）：上一个 Release 的 Agent 从 Release 附件下载，不用 Actions Artifacts（ADR 0010）。
      - name: Previous release agent
        run: pnpm fetch:previous-agent
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Bundle smoke test
        run: pnpm test:bundle
      - name: Image smoke test
        run: pnpm test:image

  # 前端端到端测试与视觉回归（apps/web/e2e）：在 Playwright 官方镜像中运行，与本机
  # `pnpm test:e2e:docker` 使用同一镜像（浏览器和字体一致，视觉基线才可比）。
  # 镜像标签与 apps/web/package.json 中 @playwright/test 的版本保持一致。
  e2e:
    runs-on: [self-hosted, linux, sfly-ci]
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sfly
          POSTGRES_PASSWORD: sfly
          POSTGRES_DB: sfly
        options: >-
          --health-cmd "pg_isready -U sfly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://sfly:sfly@postgres:5432/sfly
      SFLY_VISUAL: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          # 私有仓库的 Artifacts 与 Packages 共用存储额度，只保留一天。
          retention-days: 1
