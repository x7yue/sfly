[package]
name = "sfly-agent"
version = "0.5.0"
description = "sfly Agent：连接控制面、安装节点包、执行任务"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
pep440_rs = "0.7.3"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip：解析小数时用足够的精度，读出的是写出者的那个双精度数。默认的快速路径遇到 16、17 位有效数字的小数
# 会差最后一位（#450：29491.727857142858 读成 29491.727857142854），Agent 读执行器写的 output.json、读控制面派来的
# inputs_json 都要「解析再写出」，节点输出经过平台后就变了。代价是解析小数慢一些，只有 Agent 自己读的这些文件和事件里的数受影响。
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
# 地址按 URL 解析器的读法写出来（uv、reqwest 打印的就是它）：已知带凭据的地址按值打码要认出这些写法（secret.rs，#757）。
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "inotify", "poll", "process", "signal", "time"] }

[dev-dependencies]
# 基准测试（benches/，docs/ARCHITECTURE.md §7.6）：只作开发依赖，不进 release 二进制；不要图表，少编译 rayon / plotters。
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process"] }
tokio-stream = { version = "0.1", features = ["net"] }

[[bench]]
name = "telemetry"
harness = false

[build-dependencies]
tonic-prost-build = "0.14"
