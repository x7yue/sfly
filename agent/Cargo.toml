[package]
name = "sfly-agent"
version = "0.1.2"
description = "sfly Agent：连接控制面、安装节点包、执行任务"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "process", "signal", "time"] }

[dev-dependencies]
# 基准测试（benches/，ARCHITECTURE §7.6）：只作开发依赖，不进 release 二进制；不要图表，少编译 rayon / plotters。
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process"] }
tokio-stream = { version = "0.1", features = ["net"] }

[[bench]]
name = "telemetry"
harness = false

[build-dependencies]
tonic-prost-build = "0.14"
