syntax = "proto3";

package sfly.agent.v1;

import "sfly/agent/v1/agent.proto";

// Agent 之间的服务（ADR 0019）：每台 Agent 在自己的端口（默认 50052）上提供，供其它 Agent 直接连接，
// 数据不经过控制面。没有认证，只应在内网使用。每项 Agent 能力是同一个端口上的另一个服务，各在自己的文件里
// （例如 files.proto 的 AgentFiles）；调用之前用 Describe 确认对方支持这项能力。
service AgentPeer {
  // 这台 Agent 是谁、支持哪些能力：调用能力之前确认连到的是要找的 Agent、它的版本支持所需的操作。
  rpc Describe(DescribeRequest) returns (DescribeResponse);
}

message DescribeRequest {}

message DescribeResponse {
  // Agent 名称。
  string name = 1;
  // Agent 程序版本。
  string agent_version = 2;
  // 支持的 Agent 能力及各自的版本，与 Hello.capabilities 相同。
  repeated Capability capabilities = 3;
}
