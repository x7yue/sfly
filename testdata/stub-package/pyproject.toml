# 通用桩节点包：Agent（切入点 B）与全栈冒烟测试用。用 `sfly build testdata/stub-package` 构建。
[project]
name = "sfly-stub"
version = "0.1.0"
dependencies = []

# 跨版本自更新测试（bundle-self-update）在上一个发布版本的 Agent 上运行它（`fetch:previous-agent --simulate`
# 时版本为 0.0.0）：桩节点只用最早就有的 SDK 接口，不限制 SDK 版本（#79）。
[tool.sfly]
requires-sdk = ">=0.0.0"
